[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing (react-router) needs every path to fall back to
# index.html, otherwise a hard refresh on /admin returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Remember to also set these in the Netlify UI (Site configuration ->
# Environment variables) — they are NOT read from this file:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
